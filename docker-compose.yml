services:
  app:
    build: .
    container_name: user_management_app
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:17
    container_name: user_management_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: user_management_redis
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data: